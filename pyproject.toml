[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football-intelligence"
version = "0.1.0"
description = "Football Club Intelligence & Scouting Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
dbt = ["dbt-postgres>=1.8,<2"]

[project.scripts]
football = "football_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/football_intelligence/api/*.py" = ["B008"]
